# Local 3-node CockroachDB cluster: development target and the node-kill
# survivability demo (spec section 4). Insecure mode: ports are loopback-bound
# so the insecure cluster is never reachable from the network.
#
# Docker Desktop commonly gives its Linux VM about 4 GiB. Without explicit
# budgets, every node sees that full amount and reserves about 980 MiB for SQL,
# which can OOM a three-node cluster during concurrent schema changes.
services:
  roach1:
    image: cockroachdb/cockroach:v26.2.5
    command:
      - start
      - --insecure
      - --join=roach1,roach2,roach3
      - --advertise-addr=roach1
      - --cache=128MiB
      - --max-sql-memory=128MiB
      - --max-tsdb-memory=64MiB
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8080:8080"
    volumes:
      - roach1:/cockroach/cockroach-data
  roach2:
    image: cockroachdb/cockroach:v26.2.5
    command:
      - start
      - --insecure
      - --join=roach1,roach2,roach3
      - --advertise-addr=roach2
      - --cache=128MiB
      - --max-sql-memory=128MiB
      - --max-tsdb-memory=64MiB
    ports:
      - "127.0.0.1:26258:26257"
      - "127.0.0.1:8081:8080"
    volumes:
      - roach2:/cockroach/cockroach-data
  roach3:
    image: cockroachdb/cockroach:v26.2.5
    command:
      - start
      - --insecure
      - --join=roach1,roach2,roach3
      - --advertise-addr=roach3
      - --cache=128MiB
      - --max-sql-memory=128MiB
      - --max-tsdb-memory=64MiB
    ports:
      - "127.0.0.1:26259:26257"
      - "127.0.0.1:8082:8080"
    volumes:
      - roach3:/cockroach/cockroach-data
volumes:
  roach1:
  roach2:
  roach3:
