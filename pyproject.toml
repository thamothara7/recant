[project]
name = "recant"
version = "0.1.0"
description = "Chain of custody for machine memory: provenance and retraction substrate for agent memory on CockroachDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "cryptography>=50.0.0",
    "httpx>=0.27",
    "langchain-cockroachdb>=0.2.1",
    "asyncpg>=0.31.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["console", ".venv", "fanout/iac/build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["console", ".venv", "fanout/iac/build"]
